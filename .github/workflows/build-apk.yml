
name: Gerar APK Meu Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -q MeuFinanceiro-Projeto-Android.zip -d extraido

      - name: Compilar APK
        run: |
          WRAPPER=$(find extraido -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Arquivo gradlew não encontrado no ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Financeiro-APK
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
